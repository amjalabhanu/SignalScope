services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: signalscope
      POSTGRES_USER: signalscope
      POSTGRES_PASSWORD: signalscope_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
      
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
  
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://signalscope:signalscope_password@postgres:5432/signalscope
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis




volumes:
  postgres_data:
  redis_data: